 2</text><rect x="532" y="241" width="308" height="37" fill="#e9b34a"/><text x="686" y="265" text-anchor="middle" font-size="15" fill="#101b2b">C: 11</text><text x="860" y="265" font-size="14">A 35% | A+B 45%</text><rect x="30" y="335" width="14" height="14" fill="#197a65"/><text x="50" y="347" font-size="12">A Correct handling</text><rect x="210" y="335" width="14" height="14" fill="#5f9dcc"/><text x="230" y="347" font-size="12">B Constraint representation</text><rect x="440" y="335" width="14" height="14" fill="#e9b34a"/><text x="460" y="347" font-size="12">C Contract block</text><rect x="600" y="335" width="14" height="14" fill="#cd5555"/><text x="620" y="347" font-size="12">D Semantic error / excess stop</text><rect x="865" y="335" width="14" height="14" fill="#9b9b9b"/><text x="885" y="347" font-size="12">X Interrupted</text><text x="30" y="380" font-size="12">Purposive same-scene sample; provider and pipeline contracts differ. Historical catalogues, not the new 48-item requirements.</text></g></svg>